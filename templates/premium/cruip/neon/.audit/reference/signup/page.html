<!DOCTYPE html><html lang="en"><head>
    <meta charset="utf-8">
    <title>Neon - Sign Up by Cruip</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" type="image/png" href="./favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="./favicon/favicon.svg">
    <link rel="shortcut icon" href="./favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png">
    <link rel="manifest" href="./favicon/site.webmanifest">
    <link href="./css/vendors/aos.css" rel="stylesheet">
    <link href="./style.css" rel="stylesheet">
</head>

<body class="font-inter antialiased bg-gray-900 text-gray-100 tracking-tight" data-aos-easing="ease-out-cubic" data-aos-duration="500" data-aos-delay="0">


    <div class="flex flex-col min-h-screen overflow-hidden">


        <header class="absolute w-full z-30">
            <div class="max-w-6xl mx-auto px-4 sm:px-6">
                <div class="flex items-center justify-between h-16 md:h-20">


                    <div class="shrink-0 mr-4">

                        <a class="block" href="index.html" aria-label="Cruip">
                            <svg class="w-8 h-8" viewBox="0 0 32 32" xmlns:xlink="http://www.w3.org/1999/xlink">
                                <defs>
                                    <radialGradient cx="50%" cy="89.845%" fx="50%" fy="89.845%" r="108.567%" gradientTransform="matrix(-.00915 -.82755 .99996 -.00757 -.394 1.319)" id="logo1-b">
                                        <stop stop-color="#3B82F6" stop-opacity=".64" offset="0%"></stop>
                                        <stop stop-color="#F472B6" stop-opacity=".876" offset="100%"></stop>
                                    </radialGradient>
                                    <radialGradient cx="50%" cy="89.845%" fx="50%" fy="89.845%" r="108.567%" gradientTransform="matrix(-.00915 -.82755 .99996 -.00757 -.394 1.319)" id="logo1-d">
                                        <stop stop-color="#3B82F6" stop-opacity=".64" offset="0%"></stop>
                                        <stop stop-color="#D375C2" stop-opacity=".833" offset="50.358%"></stop>
                                        <stop stop-color="#FBCFE8" stop-opacity=".876" offset="100%"></stop>
                                    </radialGradient>
                                    <path d="M12 32c8-6.915 12-12.582 12-17 0-6.627-5.373-12-12-12S0 8.373 0 15c0 4.418 4 10.085 12 17Z" id="logo1-a"></path>
                                    <path d="M20 29c8-6.915 12-12.582 12-17 0-6.627-5.373-12-12-12S8 5.373 8 12c0 4.418 4 10.085 12 17Z" id="logo1-c"></path>
                                </defs>
                                <g fill="none" fill-rule="evenodd">
                                    <use fill="url(#logo1-b)" opacity=".64" transform="matrix(1 0 0 -1 0 35)" xlink:href="#logo1-a"></use>
                                    <use fill="url(#logo1-d)" opacity=".961" xlink:href="#logo1-c"></use>
                                </g>
                            </svg>
                        </a>
                    </div>

                </div>
            </div>
        </header>

        <main class="relative grow flex">


            <div class="w-full bg-gray-900">

                <div class="h-full flex flex-col justify-center before:min-h-[4rem] md:before:min-h-[5rem] before:flex-1 after:flex-1">

                    <div class="px-4 sm:px-6">
                        <div class="w-full max-w-sm mx-auto">
                            <div class="py-16 md:py-20">

                                <div class="mb-8">
                                    <h1 class="h2 font-uncut-sans">Sign Up</h1>
                                </div>


                                <form>
                                    <div class="space-y-4">
                                        <div>
                                            <label class="block text-sm text-gray-400 font-medium mb-1" for="email">Email <span class="text-pink-500">*</span></label>
                                            <input id="email" class="form-input py-2 w-full" type="email" required="" style="">
                                        </div>
                                        <div class="space-y-4 sm:flex sm:space-y-0 sm:space-x-4">
                                            <div class="sm:w-1/2">
                                                <label class="block text-sm text-gray-400 font-medium mb-1" for="name">Name <span class="text-pink-500">*</span></label>
                                                <input id="name" class="form-input py-2 w-full" type="text" required="" style="">
                                            </div>
                                            <div class="sm:w-1/2">
                                                <label class="block text-sm text-gray-400 font-medium mb-1" for="surname">Surname <span class="text-pink-500">*</span></label>
                                                <input id="surname" class="form-input py-2 w-full" type="text" required="" style="">
                                            </div>
                                        </div>
                                        <div>
                                            <label class="block text-sm text-gray-400 font-medium mb-1" for="password">Password</label>
                                            <input id="password" class="form-input py-2 w-full" type="password" autocomplete="on" required="" style="">
                                        </div>
                                    </div>
                                    <div class="mt-6">
                                        <button class="btn-sm text-white bg-linear-to-t from-blue-600 to-blue-400 hover:to-blue-500 w-full shadow-lg group">
                                            Sign Up <span class="tracking-normal text-blue-200 group-hover:translate-x-0.5 transition-transform duration-150 ease-in-out ml-1">-&gt;</span>
                                        </button>
                                    </div>
                                </form>


                                <div class="flex items-center my-6">
                                    <div class="border-t border-gray-800 grow mr-3" aria-hidden="true"></div>
                                    <div class="text-sm text-gray-400 italic">Or</div>
                                    <div class="border-t border-gray-800 grow ml-3" aria-hidden="true"></div>
                                </div>


                                <button class="btn-sm text-white bg-linear-to-t from-pink-500 to-pink-400 hover:to-pink-500 w-full relative flex after:flex-1">
                                    <div class="flex-1 flex items-center">
                                        <svg class="w-4 h-4 fill-current text-pink-200 shrink-0" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M15.679 6.545H8.043v3.273h4.328c-.692 2.182-2.401 2.91-4.363 2.91a4.727 4.727 0 1 1 3.035-8.347l2.378-2.265A8 8 0 1 0 8.008 16c4.41 0 8.4-2.909 7.67-9.455Z"></path>
                                        </svg>
                                    </div>
                                    <span class="flex-auto text-pink-50 pl-3">Continue With Google</span>
                                </button>

                                <div class="text-sm text-gray-500 italic mt-6 mb-4">
                                    By filling out this form, I consent to the collection and use of my personal data.
                                </div>

                                <div class="pt-4 border-t border-gray-800">
                                    <div class="text-sm text-gray-400">
                                        Already have an account? <a class="font-medium text-blue-500 hover:text-blue-400" href="signin.html">Sign In</a>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>

                </div>

            </div>


            <div class="hidden lg:block shrink-0 w-1/3 overflow-hidden before:bg-gray-800 before:absolute before:inset-0 before:-z-10">
                <div class="absolute left-1/2 -translate-x-1/2 pointer-events-none -z-10" aria-hidden="true">
                    <img src="./images/hero-illustration.svg" class="max-w-none" width="2143" height="737" alt="Hero Illustration">
                </div>
                <div class="absolute left-1/2 -translate-x-1/2 pointer-events-none -z-10" aria-hidden="true">
                    <img src="./images/auth-illustration.svg" class="max-w-none" width="1440" height="880" alt="Auth Illustration">
                </div>
            </div>

        </main>

    </div>

    <script src="./js/vendors/alpinejs.min.js" defer=""></script>
    <script src="./js/vendors/aos.js"></script>
    <script src="./js/main.js"></script>
