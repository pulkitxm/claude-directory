<!DOCTYPE html><html lang="en" style="color-scheme: light;"><head>
    <meta charset="utf-8">
    <title>Reset Password - Mosaic</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" type="image/png" href="./favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="./favicon/favicon.svg">
    <link rel="shortcut icon" href="./favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png">
    <link rel="manifest" href="./favicon/site.webmanifest">
    <link href="./css/vendors/flatpickr.min.css" rel="stylesheet">
    <link href="./style.css" rel="stylesheet">
    <script>
        if (localStorage.getItem('dark-mode') === 'false' || !('dark-mode' in localStorage)) {
            document.querySelector('html').classList.remove('dark');
            document.querySelector('html').style.colorScheme = 'light';
        } else {
            document.querySelector('html').classList.add('dark');
            document.querySelector('html').style.colorScheme = 'dark';
        }
    </script>
</head>

<body class="font-inter antialiased bg-gray-100 dark:bg-gray-900 text-gray-600 dark:text-gray-400">

    <script>
        if (localStorage.getItem('sidebar-expanded') == 'true') {
            document.querySelector('body').classList.add('sidebar-expanded');
        } else {
            document.querySelector('body').classList.remove('sidebar-expanded');
        }
    </script>

    <main class="bg-white dark:bg-gray-900">

        <div class="relative md:flex">


            <div class="md:w-1/2">

                <div class="flex h-full min-h-[100dvh] flex-col after:flex-1">


                    <div class="flex-1">
                        <div class="flex h-16 items-center justify-between px-4 sm:px-6 lg:px-8">

                            <a class="flex items-center gap-2" href="index.html">
                                <svg class="shrink-0 fill-violet-500" xmlns="http://www.w3.org/2000/svg" width="32" height="32">
                                    <path d="M31.956 14.8C31.372 6.92 25.08.628 17.2.044V5.76a9.04 9.04 0 0 0 9.04 9.04h5.716ZM14.8 26.24v5.716C6.92 31.372.63 25.08.044 17.2H5.76a9.04 9.04 0 0 1 9.04 9.04Zm11.44-9.04h5.716c-.584 7.88-6.876 14.172-14.756 14.756V26.24a9.04 9.04 0 0 1 9.04-9.04ZM.044 14.8C.63 6.92 6.92.628 14.8.044V5.76a9.04 9.04 0 0 1-9.04 9.04H.044Z"></path>
                                </svg>
                                <span class="text-xl font-bold text-gray-800 dark:text-gray-100 lg:hidden lg:sidebar-expanded:block 2xl:block">Mosaic</span>
                            </a>
                        </div>
                    </div>

                    <div class="mx-auto w-full max-w-sm px-4 py-8">

                        <h1 class="mb-6 text-3xl font-bold text-gray-800 dark:text-gray-100">Reset your Password</h1>

                        <form>
                            <div class="space-y-4">
                                <div>
                                    <label class="mb-1 block text-sm font-medium" for="email">Email Address <span class="text-red-500">*</span></label>
                                    <input id="email" class="form-input w-full" type="email" style="">
                                </div>
                            </div>
                            <div class="flex justify-end mt-6">
                                <button class="btn bg-gray-900 whitespace-nowrap text-gray-100 hover:bg-gray-800 dark:bg-gray-100 dark:text-gray-800 dark:hover:bg-white">Send Reset Link</button>
                            </div>
                        </form>

                    </div>

                </div>

            </div>


            <div class="absolute top-0 right-0 bottom-0 hidden md:block md:w-1/2" aria-hidden="true">
                <img class="h-full w-full object-cover object-center" src="./images/auth-image.jpg" width="760" height="1024" alt="Authentication">
            </div>

        </div>

    </main>

    <script src="./js/vendors/alpinejs.min.js" defer=""></script>
    <script src="./js/main.js"></script>



</body></html>
