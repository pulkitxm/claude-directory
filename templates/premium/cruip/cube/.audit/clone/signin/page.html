<!DOCTYPE html><html lang="en"><head>
    <meta charset="utf-8">
    <title>Cube HTML Demo - Sign in</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" type="image/png" href="./favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="./favicon/favicon.svg">
    <link rel="shortcut icon" href="./favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png">
    <link rel="manifest" href="./favicon/site.webmanifest">
    <meta name="theme-color" content="#0f172a">
    <link href="./css/vendors/aos.css" rel="stylesheet">
    <link href="./styles.css" rel="stylesheet">
</head>

<body class="font-inter antialiased bg-slate-900 text-slate-200 tracking-tight" data-aos-easing="ease-out-cubic" data-aos-duration="500" data-aos-delay="0">

    <div class="flex flex-col min-h-screen overflow-hidden">

        <header class="absolute w-full z-30">
            <div class="max-w-6xl mx-auto px-4 sm:px-6">
                <div class="flex items-center justify-between h-16 md:h-20">

                    <div class="shrink-0 mr-4">

                        <a class="block" href="index.html" aria-label="Cruip">
                            <svg class="w-8 h-8" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                                <defs>
                                    <linearGradient x1="0%" y1="32.443%" x2="104.18%" y2="50%" id="hlogo-a">
                                        <stop stop-color="#FFF" stop-opacity=".299" offset="0%"></stop>
                                        <stop stop-color="#7587E4" stop-opacity="0" offset="100%"></stop>
                                    </linearGradient>
                                    <linearGradient x1="18.591%" y1="0%" x2="100%" y2="100%" id="hlogo-b">
                                        <stop stop-color="#818CF8" offset="0%"></stop>
                                        <stop stop-color="#C7D2FE" offset="100%"></stop>
                                    </linearGradient>
                                </defs>
                                <g fill="none" fill-rule="evenodd">
                                    <path fill="#3730A3" d="M16 18.5V32l15.999-9.25V9.25z"></path>
                                    <path fill="#4F46E5" d="m0 23 16 9V18.501L0 9.251z"></path>
                                    <path fill-opacity=".64" fill="url(#hlogo-a)" d="M16 13 0 23l16 9 16-9z"></path>
                                    <path fill="url(#hlogo-b)" d="M16 0 0 9.25l16 9.25 15.999-9.25z"></path>
                                </g>
                            </svg>
                        </a>
                    </div>

                </div>
            </div>
        </header>

        <main class="grow">

            <section class="relative">

                <div class="hidden md:block absolute left-1/2 -translate-x-1/2 pointer-events-none -z-10" aria-hidden="true">
                    <img src="./assets/images/auth-illustration.svg" class="max-w-none" width="1440" height="332" alt="Page Illustration">
                </div>

                <div class="relative max-w-6xl mx-auto px-4 sm:px-6">
                    <div class="pt-32 pb-12 md:pt-40 md:pb-20">

                        <div class="max-w-3xl mx-auto text-center pb-12">
                            <h1 class="h2 font-hkgrotesk">Welcome back!</h1>
                        </div>

                        <div class="max-w-sm mx-auto">

                            <form>
                                <div class="space-y-4">
                                    <div>
                                        <label class="block text-sm text-slate-400 font-medium mb-1" for="email">Email</label>
                                        <input id="email" class="form-input text-sm py-2 w-full" type="email" required="" style="">
                                    </div>
                                    <div>
                                        <div class="flex justify-between">
                                            <label class="block text-sm text-slate-400 font-medium mb-1" for="password">Password</label>
                                            <a class="text-sm font-medium text-indigo-500 ml-2" href="reset-password.html">Forgot?</a>
                                        </div>
                                        <input id="password" class="form-input text-sm py-2 w-full" type="password" autocomplete="on" required="" style="">
                                    </div>
                                </div>
                                <div class="mt-6">
                                    <button class="btn-sm text-sm text-white bg-indigo-500 hover:bg-indigo-600 w-full shadow-xs group">
                                        Sign In <span class="tracking-normal text-sky-300 group-hover:translate-x-0.5 transition-transform duration-150 ease-in-out ml-1">-&gt;</span>
                                    </button>
                                </div>
                            </form>

                            <div class="flex items-center my-6">
                                <div class="border-t border-slate-800 grow mr-3" aria-hidden="true"></div>
                                <div class="text-sm text-slate-500 italic">Or</div>
                                <div class="border-t border-slate-800 grow ml-3" aria-hidden="true"></div>
                            </div>

                            <button class="btn-sm text-sm text-white bg-rose-500 w-full relative flex after:flex-1">
                                <div class="flex-1 flex items-center">
                                    <svg class="w-4 h-4 fill-current text-rose-200 shrink-0" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M15.679 6.545H8.043v3.273h4.328c-.692 2.182-2.401 2.91-4.363 2.91a4.727 4.727 0 1 1 3.035-8.347l2.378-2.265A8 8 0 1 0 8.008 16c4.41 0 8.4-2.909 7.67-9.455Z"></path>
                                    </svg>
                                </div>
                                <span class="flex-auto text-rose-50 pl-3">Continue With Google</span>
                            </button>

                            <div class="text-center mt-6">
                                <div class="text-sm text-slate-500">
                                    Don't you have an account? <a class="font-medium text-indigo-500" href="signup.html">Get Started</a>
                                </div>
                            </div>

                        </div>

                    </div>
                </div>

            </section>

        </main>

    </div>

    <script src="./js/vendors/alpinejs.min.js" defer=""></script>
    <script src="./js/vendors/aos.js"></script>
    <script src="./js/main.js"></script>




</body></html>
