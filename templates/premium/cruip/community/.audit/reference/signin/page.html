<!DOCTYPE html><html lang="en"><head>
    <meta charset="utf-8">
    <title>Community HTML Demo - Sign In</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" type="image/png" href="./favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="./favicon/favicon.svg">
    <link rel="shortcut icon" href="./favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png">
    <link rel="manifest" href="./favicon/site.webmanifest">
    <link href="./style.css" rel="stylesheet">
</head>

<body class="font-inter antialiased bg-slate-900 text-slate-200 tracking-tight">

    <!-- Page wrapper -->
    <div class="flex flex-col min-h-screen overflow-hidden supports-[overflow:clip]:overflow-clip">

        <!-- Site header -->
        <header class="absolute w-full z-30">
            <div class="max-w-6xl mx-auto px-4 sm:px-6">
                <div class="flex items-center justify-between h-16 md:h-20">

                    <!-- Site branding -->
                    <div class="shrink-0 mr-4">
                        <!-- Logo -->
                        <a class="block group" href="index.html" aria-label="Cruip">
                            <img src="./images/logo.svg" width="32" height="32" alt="Community">
                        </a>
                    </div>

                    <nav class="flex grow">
                        <div class="flex grow justify-end flex-wrap items-center">
                            <div class="text-sm text-slate-500">
                                Not a member? <a class="font-medium text-indigo-500 hover:text-indigo-400 transition duration-150 ease-in-out" href="join.html">Join</a>
                            </div>
                        </div>
                    </nav>

                </div>
            </div>
        </header>

        <main class="grow">

            <section class="relative">

                <!-- Illustration -->
                <div class="absolute left-1/2 -translate-x-1/2 pointer-events-none -z-10" aria-hidden="true">
                    <img src="./images/hero-illustration.svg" class="max-w-none" width="1905" height="622" alt="Hero Illustration">
                </div>

                <div class="relative max-w-6xl mx-auto px-4 sm:px-6">
                    <div class="pt-32 pb-12 md:pt-40 md:pb-20">

                        <!-- Page header -->
                        <div class="max-w-2xl mx-auto text-center">
                            <h1 class="h2 font-aspekta bg-clip-text text-transparent bg-linear-to-tr from-indigo-500 via-sky-300 to-slate-200 pb-12">Welcome back to the Community</h1>
                        </div>

                        <!-- Form -->
                        <div class="max-w-sm mx-auto">

                            <form>
                                <div class="space-y-4">
                                    <div>
                                        <label class="sr-only" for="email">Email</label>
                                        <input id="email" class="form-input text-sm w-full" type="email" placeholder="Your email" required="" style="">
                                    </div>
                                    <div>
                                        <label class="sr-only" for="password">Password</label>
                                        <input id="password" class="form-input text-sm w-full" type="password" placeholder="Your password" autocomplete="on" required="" style="">
                                    </div>
                                </div>
                                <div class="mt-6">
                                    <button class="btn-sm text-white bg-indigo-500 hover:bg-indigo-600 w-full">Sign In</button>
                                </div>
                            </form>

                            <!-- Divider -->
                            <div class="flex items-center my-4">
                                <div class="border-t border-slate-800 grow mr-3" aria-hidden="true"></div>
                                <div class="text-xs text-slate-400 italic">Or</div>
                                <div class="border-t border-slate-800 grow ml-3" aria-hidden="true"></div>
                            </div>

                            <!-- Social login -->
                            <button class="btn-sm h-9 text-indigo-500 border border-slate-700 bg-linear-to-tr from-slate-800/20 via-slate-800/50 to-slate-800/20 hover:bg-slate-800 w-full relative flex after:flex-1">
                                <div class="flex-1 flex items-center">
                                    <svg class="w-4 h-4 fill-indigo-500 shrink-0" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M15.679 6.545H8.043v3.273h4.328c-.692 2.182-2.401 2.91-4.363 2.91a4.727 4.727 0 1 1 3.035-8.347l2.378-2.265A8 8 0 1 0 8.008 16c4.41 0 8.4-2.909 7.67-9.455Z"></path>
                                    </svg>
                                </div>
                                <span class="flex-auto pl-3">Sign In With Google</span>
                            </button>

                        </div>

                    </div>
                </div>

            </section>

        </main>

    </div>

    <script src="./js/vendors/alpinejs.min.js" defer=""></script>
    <script src="./js/main.js"></script>

<script defer="" src="https://static.cloudflareinsights.com/beacon.min.js/v4513226cdae34746b4dedf0b4dfa099e1781791509496" integrity="sha512-ZE9pZaUXND66v380QUtch/5sE9tPFh2zg45pR2PB0CVkCtOREv2AJKkSidISWkysEuQ0EH8faUU5du78bx87UQ==" data-cf-beacon="{&quot;version&quot;:&quot;2024.11.0&quot;,&quot;token&quot;:&quot;59cc17d45d734f9ba118c63036ab1b84&quot;,&quot;r&quot;:1,&quot;server_timing&quot;:{&quot;name&quot;:{&quot;cfCacheStatus&quot;:true,&quot;cfEdge&quot;:true,&quot;cfExtPri&quot;:true,&quot;cfL4&quot;:true,&quot;cfOrigin&quot;:true,&quot;cfSpeedBrain&quot;:true},&quot;location_startswith&quot;:null}}" crossorigin="anonymous"></script>


</body></html>
