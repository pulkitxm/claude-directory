                        <h1 class="h2 font-playfair-display text-slate-800 mb-12">Sign in to Tidy</h1>


                        <div class="space-y-3">

                                    </svg>

                            </button>
                            <button class="btn-sm p-0 text-white bg-blue-600 hover:bg-blue-700 w-full relative flex items-stretch">
                                <div class="flex items-center bg-blue-700 mr-4">
                                    <svg class="w-4 h-4 fill-current text-blue-100 shrink-0 mx-3" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">

                                    </svg>
                                </div>

                            </button>
                        </div>


                        <div class="flex items-center my-6">
                            <div class="border-t border-slate-200 grow mr-3" aria-hidden="true"></div>
                            <div class="text-sm text-slate-500 italic">or</div>
                            <div class="border-t border-slate-200 grow ml-3" aria-hidden="true"></div>
                        </div>


                        <form>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium mb-1" for="email">Email <span class="text-rose-500">*</span></label>
                                    <input id="email" class="form-input py-2 w-full" type="email" required="" style="">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1" for="password">Password <span class="text-rose-500">*</span></label>
                                    <input id="password" class="form-input py-2 w-full" type="password" autocomplete="on" required="" style="">
                                </div>
                            </div>
                            <div class="mt-6">
                                <button class="btn-sm w-full text-sm text-white bg-blue-600 hover:bg-blue-700 group">
                                    Sign In <span class="tracking-normal text-blue-300 group-hover:translate-x-0.5 transition-transform duration-150 ease-in-out ml-1">-&gt;</span>
                                </button>
                            </div>
                            <div class="text-center mt-5">
                                <a class="text-blue-600 hover:underline" href="reset-password.html">Forgot your password?</a>
                            </div>
                        </form>

                    </div>
                </div>

            </div>

        </div>


        <div class="relative hidden md:block md:w-1/2 bg-slate-900" aria-hidden="true">


            <div class="absolute inset-0 aos-init aos-animate" data-aos="fade">
                <img class="opacity-10 w-full h-full object-cover" src="./images/sign-in-bg.jpg" width="760" height="900" alt="Background">
            </div>


            <div class="min-h-screen h-full flex flex-col justify-center">
                <div class="px-5 sm:px-6">
                    <div class="w-full max-w-lg mx-auto">
                        <h2 class="h3 md:text-4xl font-playfair-display text-slate-100 mb-4">The Wealth Inc.</h2>
                        <div class="space-y-3">
                            <svg class="fill-blue-600" width="20" height="16" viewBox="0 0 20 16">
                                <path d="M2.76 16c2.577 0 5.154-3.219 5.154-5.996 0-1.357-.613-2.272-1.748-2.272s-2.27.726-3.283 1.64C3.16 6.439 5.613 3.346 9.571.885L9.233 0C3.466 2.903 0 7.732 0 12.213 0 14.517.828 16 2.76 16Zm10.43 0c2.577 0 5.154-3.219 5.154-5.996 0-1.357-.614-2.272-1.749-2.272-1.135 0-2.27.726-3.282 1.64.276-2.934 2.73-6.027 6.687-8.488L19.663 0c-5.767 2.903-9.234 7.732-9.234 12.213 0 2.304.829 3.787 2.761 3.787Z"></path>

                        </div>
                        <div class="flex items-center mt-4">
                            <a href="#0">
                                <img class="rounded-full shrink-0 mr-3" src="./images/customer-avatar-05.jpg" width="32" height="32" alt="Customer Avatar 05">
                            </a>
                            <div class="font-medium">
                                <span class="text-slate-200">Michael Crob</span>
                                <span class="text-slate-600"> · </span>
                                <span class="text-slate-500">CEO, The Wealth Inc.</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </main>
