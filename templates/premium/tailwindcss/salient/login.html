<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In - TaxPal</title>
  <meta name="description" content="Most bookkeeping software is accurate, but hard to use. We make the opposite trade-off, and hope you don't get audited.">
  <link rel="icon" href="./assets/images/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="./styles.css">
</head>
<body style="height:100%;display:flex;flex-direction:column;">

<div class="auth-page">
  <!-- Form side -->
  <div class="auth-form-side">
    <div class="auth-form-inner">
      <!-- Logo -->
      <a href="index.html" class="auth-logo" aria-label="TaxPal home">
        <svg viewBox="0 0 109 40" width="100" height="36" aria-hidden="true" fill="none">
          <rect x="0" y="8" width="24" height="24" rx="4" fill="#155dfc"/>
          <path d="M6 14h12M6 20h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <text x="32" y="28" font-family="Lexend,sans-serif" font-weight="500" font-size="18" fill="#0f172b">TaxPal</text>
        </svg>
      </a>

      <h1 class="auth-title">Sign in to your account</h1>
      <p class="auth-subtitle">
        Don't have an account?
        <a href="register.html">Sign up</a> for a free trial.
      </p>

      <form class="auth-form" action="#" method="post" novalidate>
        <div class="form-field">
          <label class="form-label" for="email">Email address</label>
          <input class="form-input" id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
        </div>

        <div class="form-field">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <button type="submit" class="auth-submit">
          <span>Sign in</span>
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M4.5 10h11M10.5 5l5 5-5 5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <!-- Decorative side -->
  <div class="auth-deco-side">
    <div class="auth-deco-content">
      <blockquote style="max-width:28rem;margin:auto;padding:2rem;">
        <p style="font-size:1.125rem;line-height:1.75rem;color:rgba(255,255,255,0.85);margin-bottom:1.5rem;">"TaxPal is so easy to use I can't help but wonder if it's really doing the things the government expects me to do."</p>
        <footer style="display:flex;align-items:center;gap:0.875rem;">
          <img src="./assets/images/avatar-1.png" alt="Sheryl Berge" style="width:2.5rem;height:2.5rem;border-radius:9999px;">
          <div>
            <p style="font-family:'Lexend',sans-serif;font-weight:500;color:#fff;font-size:0.9375rem;">Sheryl Berge</p>
            <p style="color:rgba(255,255,255,0.6);font-size:0.8125rem;">CEO at Lynch LLC</p>
          </div>
        </footer>
      </blockquote>
    </div>
  </div>
</div>

</body>
</html>
