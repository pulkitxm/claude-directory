<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Vertical Clip Text , Letter-by-Letter Slide-Down</title>
		<link rel="stylesheet" href="styles.css">

<link rel="icon" href="data:,">
</head>
	<body>

		<div class="grain" aria-hidden="true"></div>

		<header class="topbar">
			<span class="label">Vertical&nbsp;Clip / Text</span>
			<button class="replay" type="button">
				<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 8l6 4-6 4z" fill="currentColor"/></svg>
				Replay
			</button>
		</header>

		<main class="wrap">
			<div class="stage" id="stage">
				<h1 class="headline">
					<span class="line">Motion</span>
					<span class="line">in every</span>
					<span class="line">letter.</span>
				</h1>
				<p class="subline">A vertical-clip slide-down, one glyph at a time.</p>
			</div>
		</main>

		<footer class="hairline">
			<span class="caption"
				>Each glyph pours down inside its own clip column</span
			>
			<span class="readout"
				><i class="dot"></i>cubic-bezier(.22,1,.36,1) · 70ms stagger</span
			>
		</footer>

		<script src="main.js"></script>
	</body>
</html>
