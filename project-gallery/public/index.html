<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Gallery</title>
  <link rel="stylesheet" href="/styles.css?v=thumb-fix-1">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Claude Directory</p>
        <h1>Project Gallery</h1>
      </div>
      <div class="toolbar" role="search">
        <label class="search">
          <span>Search</span>
          <input id="search-input" type="search" autocomplete="off" placeholder="Name, stack, description">
        </label>
        <label class="select">
          <span>Type</span>
          <select id="type-filter">
            <option value="all">All</option>
            <option value="vite">Vite</option>
            <option value="next">Next</option>
            <option value="static">Static</option>
            <option value="unknown">Video only</option>
          </select>
        </label>
        <label class="toggle">
          <input id="running-filter" type="checkbox">
          <span>Running</span>
        </label>
        <button id="stop-all" class="button danger" type="button">Stop all</button>
      </div>
    </header>

    <section class="stats" aria-live="polite">
      <div><span id="total-count">0</span><small>Total</small></div>
      <div><span id="visible-count">0</span><small>Shown</small></div>
      <div><span id="running-count">0</span><small>Running</small></div>
    </section>

    <section id="grid" class="grid" aria-live="polite"></section>
  </main>

  <dialog id="video-dialog" class="video-dialog">
    <form method="dialog">
      <button class="dialog-close" type="submit" aria-label="Close video">Close</button>
    </form>
    <video id="dialog-video" controls autoplay loop playsinline></video>
  </dialog>

  <script src="/app.js?v=thumb-fix-1"></script>
</body>
</html>
