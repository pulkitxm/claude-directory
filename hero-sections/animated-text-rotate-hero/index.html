<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta
			name="description"
			content="Motion Desk :  streamline SMB trade. An animated shadcn/ui hero with spring-rotating words, built in React + Tailwind + TypeScript."
		>


		<title>Rotating Headline Study</title>
		<script>(() => {
    try {
        var saved = localStorage.getItem("motion-desk-theme");
        var light = saved
            ? saved === "light"
            : matchMedia("(prefers-color-scheme: light)").matches;
        if (!light)
            document.documentElement.classList.add("dark");
    }
    catch (_e) {
        document.documentElement.classList.add("dark");
    }
})();
</script>
	<link rel="icon" href="data:,">
</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
